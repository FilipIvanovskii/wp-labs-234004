<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Workshop Registration - Choose a Workshop</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        .workshop-option {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .workshop-option:hover {
            background-color: #f5f5f5;
        }
        .error {
            color: red;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<header>
    <h1>Welcome to our Workshop Registration App</h1>
</header>
<main>
    <p class="error" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>

    <form action="/workshops" method="GET">
        <h2>Search workshops:</h2>
        <label>Title or category contains:</label>
        <input type="text" name="text">
        <label>Max price:</label>
        <input type="number" name="maxPrice" min="0" step="0.01">
        <input type="submit" value="Search">
    </form>

    <p>
        <a href="/workshops/workshop-form">Add new workshop</a>
    </p>

    <h2>Manage workshops:</h2>
    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Price</th>
            <th>Free seats</th>
            <th>Instructor</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="workshop : ${workshops}">
            <td th:text="${workshop.title}"></td>
            <td th:text="${workshop.category}"></td>
            <td th:text="${workshop.price + ' MKD'}"></td>
            <td th:text="${workshop.capacity}"></td>
            <td th:text="${workshop.instructor.name + ' ' + workshop.instructor.surname}"></td>
            <td>
                <a th:href="@{/workshops/workshop-form/{id}(id=${workshop.id})}">Edit</a>
                <form th:action="@{/workshops/delete/{id}(id=${workshop.id})}" method="POST" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <form action="/registration" method="POST">
        <h2>Choose a workshop:</h2>
        <div class="workshop-option" th:each="workshop : ${workshops}">
            <label>
                <input type="radio" name="workshopTitle"
                       th:value="${workshop.title}"
                       th:disabled="${workshop.capacity == 0}">
                <span th:text="${'Title: ' + workshop.title + ', Category: ' + workshop.category + ', Price: ' + workshop.price + ' MKD, Free seats: ' + workshop.capacity + ', Instructor: ' + workshop.instructor.name + ' ' + workshop.instructor.surname}"></span>
            </label>
        </div>
        <h2>Enter your information:</h2>
        <label>Your Name:</label>
        <input type="text" name="participantName" required><br/>
        <label>Your Email:</label>
        <input type="email" name="participantEmail" required><br/>

        <h2>Choose number of seats:</h2>
        <input type="number" name="numSeats" min="1" required><br/>
        <br/>
        <input type="submit" value="Register">
    </form>
</main>
</body>
</html>
